apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-next-demo-helm.fullname" . }}
  labels:
    {{- include "k8s-next-demo-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "k8s-next-demo-helm.selectorLabels" . | nindent 4 }}
